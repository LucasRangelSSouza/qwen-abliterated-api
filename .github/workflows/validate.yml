name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform -chdir=legacy/gb10/infra/terraform init -backend=false
      - run: terraform -chdir=legacy/gb10/infra/terraform validate
      - run: terraform -chdir=legacy/gb10/infra/terraform-vast init -backend=false
      - run: terraform -chdir=legacy/gb10/infra/terraform-vast fmt -check
      - run: terraform -chdir=legacy/gb10/infra/terraform-vast validate
      - run: docker compose --env-file legacy/gb10/.env.example -f legacy/gb10/compose.yaml config --quiet
      - run: bash -n legacy/gb10/scripts/*.sh
      - run: python -m py_compile tests/*.py
      - run: python -c "import json;json.load(open('tests/refusal_prompts.json',encoding='utf-8'))"
      - name: No secrets, keys or private addresses tracked
        run: |
          if git ls-files | grep -E '\.(tfstate|tfvars|pem|key)$|(^|/)\.env$'; then echo 'secret-like file tracked'; exit 1; fi
          if git grep -nIE 'BEGIN (RSA|OPENSSH|PRIVATE)|ghp_[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{20,}' -- . ':!.github/workflows/validate.yml'; then echo 'secret-like content tracked'; exit 1; fi

