name: Deploy to Vast instance

# One-click rebuild on ANY Vast container that ships sshd. Only inputs change:
# the instance address. Everything else (weights, drafter, vLLM args, Traefik
# route, DNS record) is derived from this repo and is idempotent.
on:
  workflow_dispatch:
    inputs:
      ssh_host:
        description: Vast public IP (PUBLIC_IPADDR)
        required: true
      ssh_port:
        description: Vast mapped SSH port (VAST_TCP_PORT_22)
        required: true
      api_port:
        description: Vast mapped API port (VAST_TCP_PORT_8000)
        required: true
      whisper_port:
        description: Vast mapped port for container port 3000 (VAST_TCP_PORT_3000), speech-to-text sidecar; empty disables it
        default: ''
      instance_id:
        description: Vast instance id (CONTAINER_ID), e.g. 53155573
        required: true
      public_host:
        description: Public FQDN served by the edge
        default: qwen.rangeltech.net
      edge_ip:
        description: Edge VPS IPv4 that Traefik listens on
        default: 66.94.101.153
      profile:
        description: fp8 (default; BF16 checkpoint quantised at load) or nvfp4
        default: fp8
        type: choice
        options: [fp8, nvfp4]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SSH: ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy -p ${{ inputs.ssh_port }} root@${{ inputs.ssh_host }}
    steps:
      - uses: actions/checkout@v4
      - name: SSH keys
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/deploy
          printf '%s\n' "${{ secrets.EDGE_SSH_PRIVATE_KEY }}" > ~/.ssh/edge
          chmod 600 ~/.ssh/deploy ~/.ssh/edge
      - name: Configure vLLM on the instance (idempotent, no re-download)
        run: |
          $SSH "cat > /root/configure.sh && chmod +x /root/configure.sh" < scripts/configure-vast-vllm.sh
          $SSH "WHISPER=${{ inputs.whisper_port != '' && '1' || '0' }} PROFILE=${{ inputs.profile }} PRUNE_UNUSED=1 VLLM_API_KEY='${{ secrets.VLLM_API_KEY }}' /root/configure.sh"
      - name: Publish behind Traefik + DNS
        env:
          HOSTINGER_API_KEY: ${{ secrets.HOSTINGER_API_KEY }}
        run: |
          PUBLIC_HOST=${{ inputs.public_host }}
          TOKEN=$($SSH 'echo $OPEN_BUTTON_TOKEN')
          EDGE_SSH=root@${{ inputs.edge_ip }} EDGE_KEY=~/.ssh/edge PUBLIC_HOST=$PUBLIC_HOST \
            VAST_IP=${{ inputs.ssh_host }} VAST_PORT=${{ inputs.api_port }} VAST_LABEL=C.${{ inputs.instance_id }} VAST_TOKEN="$TOKEN" WHISPER_PORT="${{ inputs.whisper_port }}" \
            scripts/publish-endpoint.sh
          scripts/dns-upsert.sh "${PUBLIC_HOST#*.}" "${PUBLIC_HOST%%.*}" ${{ inputs.edge_ip }}
        shell: bash
      - name: Wait for API and smoke test
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer ${{ secrets.VLLM_API_KEY }}" https://${{ inputs.public_host }}/v1/models) && [ "$code" = 200 ] && break
            sleep 10
          done
          scripts/smoke-test.sh https://${{ inputs.public_host }} "${{ secrets.VLLM_API_KEY }}"
