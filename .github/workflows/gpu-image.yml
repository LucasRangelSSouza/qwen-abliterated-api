name: GPU image
# Publica a imagem enxuta da GPU no GHCR (Spec 14 §5c, V2) reescrevendo as camadas direto no registro (gpu-image/relayer.py),
# sem Docker e sem gastar disco com a imagem inteira. O proprio script prova que o conjunto de arquivos das camadas novas e o
# original menos os kernels Blackwell; depois o job puxa a imagem, confere imports e cronometra o pull.
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Imagem base"
        default: "vastai/vllm:v0.30.0-cuda-13.0"
      tag:
        description: "Tag da imagem nova"
        default: "v0.30.0-cu13-slim1"
permissions:
  contents: read
  packages: write
jobs:
  relayer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMAGE: ghcr.io/lucasrangelssouza/qwen-vllm
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - name: Reescrever e publicar
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 gpu-image/relayer.py "${{ inputs.base }}" "$IMAGE:${{ inputs.tag }}" | tee relayer.log
      - name: Visibilidade (puxada anonima)
        run: |
          T=$(curl -s "https://ghcr.io/token?service=ghcr.io&scope=repository:lucasrangelssouza/qwen-vllm:pull" | python3 -c "import sys,json;print(json.load(sys.stdin).get('token',''))")
          curl -s -o /dev/null -w "manifesto anonimo: HTTP %{http_code}\n" -H "Authorization: Bearer $T" -H "Accept: application/vnd.docker.distribution.manifest.v2+json" "https://ghcr.io/v2/lucasrangelssouza/qwen-vllm/manifests/${{ inputs.tag }}"
      - name: Liberar disco
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL; df -h / | tail -1
      - name: Pull cronometrado e imports
        run: |
          /usr/bin/time -v docker pull "$IMAGE:${{ inputs.tag }}" 2>&1 | grep -E "Elapsed|Status|Digest" || true
          docker image inspect "$IMAGE:${{ inputs.tag }}" --format 'descompactada: {{.Size}} bytes, camadas: {{len .RootFS.Layers}}'
          docker run --rm --entrypoint python3 "$IMAGE:${{ inputs.tag }}" -c "import vllm, torch, flashinfer; print('vllm', vllm.__version__, 'torch', torch.__version__, 'flashinfer ok')"
          docker run --rm --entrypoint sh "$IMAGE:${{ inputs.tag }}" -c 'ls /usr/local/lib/python3.12/dist-packages/flashinfer_cubin/; du -sh /usr/local/lib/python3.12/dist-packages | tail -1'
